# PostgreSQL（docker-compose.yml の db サービス / 支出データ）の自動バックアップ (スケジュール実行)。
# helpdesk-hub / incident-insight の backup.yml を移植したもの (docs/backup.md 参照)。
#
# 仕組み:
#   - 毎日 1 回 (cron) と手動実行 (workflow_dispatch) で scripts/backup-db.sh を走らせる。
#   - 接続先は Secret `BACKUP_DATABASE_URL`。未設定ならジョブは安全に no-op で終了する
#     (fail-closed: 認証情報が無い状態でダンプを試みない)。
#   - 生成したダンプは Actions の artifact として短期保持でアップロードする。
#
# セキュリティ上の注意:
#   - artifact には本番データ = 支出データ (金額・日付・メモ等の個人の家計情報) が含まれ得る。
#     このリポジトリは public のため、平文の artifact はリポジトリ閲覧者 (= 事実上すべての
#     GitHub ユーザー) がダウンロードできてしまう。そのためダンプは Secret
#     `BACKUP_ENCRYPTION_PASSPHRASE` で GPG (AES256) 暗号化してからアップロードし、
#     パスフレーズ未設定なら平文のままアップロードせずジョブを失敗させる (fail-closed)。
#   - retention は短く設定し、支出データを GitHub に一切置きたくない運用では本ワークフローを
#     使わずホスト側 cron で scripts/backup-db.sh を実行する (docs/backup.md 参照)。
#   - BACKUP_DATABASE_URL は読み取り権限のみを持つ DB ロールを推奨する。

name: DB Backup

on:
  schedule:
    # UTC 18:00 = JST 03:00 に毎日 1 回実行する (アクセスが少ない深夜帯)
    - cron: '0 18 * * *'
  # 手動トリガも許可する (Actions 画面の Run workflow ボタン)
  workflow_dispatch:

# 既定の GITHUB_TOKEN は読み取りのみで十分 (このジョブはリポジトリに書き込まない)
permissions:
  contents: read

jobs:
  backup:
    name: pg_dump backup
    runs-on: ubuntu-latest
    env:
      # ダンプの出力先。ここが唯一の参照元で、backup-db.sh は環境変数として受け取り、
      # artifact の path もこの値を参照する (§6 定数の一元管理)。
      BACKUP_DIR: ./backup
      # ダンプのファイル名に付くタイムスタンプを JST にする。cron は UTC 18:00 (= JST 03:00)
      # で回るため、ランナー既定の UTC のままだと「前日の 18 時台」の名前になり、
      # docs/backup.md が説明する「毎日 JST 03:00 のバックアップ」と日付がずれて、
      # 復元したい日のダンプを探すときに 1 日ぶん取り違える。
      TZ: Asia/Tokyo
    steps:
      - uses: actions/checkout@v7

      # Secret の有無だけを先に判定する (実処理はしない)。
      # 判定を独立したステップに切り出すのは、未設定 (no-op) の日に postgresql-client の
      # インストールという数十秒の準備作業を走らせないため。判定・準備・実行を 1 ステップに
      # 混ぜると「何もしない日でも毎日 apt-get が動く」無駄が生じる。
      - name: Check backup secrets
        id: guard
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
        run: |
          # 接続先の Secret が無ければバックアップ対象が存在しないので no-op で終える
          # (このリポジトリを fork した環境でもジョブが赤くならないようにする)。
          if [ -z "${BACKUP_DATABASE_URL}" ]; then
            echo "BACKUP_DATABASE_URL secret が未設定のためスキップします (no-op)。" >&2
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # fail-closed: 暗号化パスフレーズが無いのに接続先だけある状態では、平文の支出データを
          # artifact に載せる事故につながるため、ダンプを作る前にジョブを失敗させる。
          if [ -z "${BACKUP_ENCRYPTION_PASSPHRASE}" ]; then
            echo "BACKUP_ENCRYPTION_PASSPHRASE secret が未設定です。" >&2
            echo "public リポジトリの artifact に平文の支出データのダンプは置けないため中止します。" >&2
            exit 1
          fi
          # 両方揃っているので後続ステップを実行してよいことを記録する
          echo "skipped=false" >> "$GITHUB_OUTPUT"

      # PostgreSQL クライアント (pg_dump) を入れる。GitHub の ubuntu-latest には
      # postgresql-client を明示導入して pg_dump のバージョン差異を避ける。
      # 実際にダンプを取る日だけ実行する (上の Check backup secrets の判定結果で分岐)。
      - name: Install postgresql-client
        if: steps.guard.outputs.skipped == 'false'
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      # ダンプを取得し、artifact に載せられる形 (GPG 暗号化済み) にするステップ。
      - name: Run backup
        id: backup
        if: steps.guard.outputs.skipped == 'false'
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
        run: |
          # スクリプトに接続先を渡してバックアップを実行する (出力先 BACKUP_DIR は
          # ジョブレベルの env から自動的に引き継がれる)。
          # backup-db.sh は「作成したダンプのパスを標準出力に 1 行返す」契約なので、それを
          # そのまま受け取る。backup/*.dump のグロブで拾い直すと (a) 何もマッチしないとき
          # bash がリテラル文字列を渡してしまい原因の分かりにくい失敗になり、(b) 無関係な
          # *.dump がワークスペースにあれば巻き込んで暗号化してしまう。
          DUMP_FILE="$(DATABASE_URL="${BACKUP_DATABASE_URL}" bash scripts/backup-db.sh)"
          # ダンプを GPG (AES256, 対称鍵) で暗号化する。パスフレーズはコマンドラインに展開せず
          # 標準入力 (--passphrase-fd 0) で渡す (ps や /proc から見えないようにするため)。
          printf '%s' "${BACKUP_ENCRYPTION_PASSPHRASE}" | gpg --batch --symmetric \
            --cipher-algo AES256 --pinentry-mode loopback --passphrase-fd 0 \
            --output "${DUMP_FILE}.gpg" "${DUMP_FILE}"
          # 暗号化に成功した後で平文ダンプを削除する (失敗時は set -e で先に停止するため、
          # 平文を消してから暗号化に失敗してバックアップを丸ごと失う事故は起きない)。
          rm -f "${DUMP_FILE}"

      # 暗号化済みダンプを artifact としてアップロードする (Secret 設定時のみファイルが存在する)。
      # 復号手順は docs/backup.md を参照 (gpg --decrypt)。
      - name: Upload backup artifact
        if: steps.guard.outputs.skipped == 'false'
        uses: actions/upload-artifact@v7
        with:
          name: db-backup-${{ github.run_id }}
          path: ${{ env.BACKUP_DIR }}/*.dump.gpg
          # 暗号化済みとはいえ本番データ由来のため保持を 7 日に短縮する
          retention-days: 7
          if-no-files-found: error
