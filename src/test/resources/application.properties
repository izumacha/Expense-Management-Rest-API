# テスト実行時のみ有効な設定（本番 application.yml の fail-closed プレースホルダを満たすための上書き）
# テスト用の DB パスワード（リポジトリテストは @DynamicPropertySource で更に上書きする）
spring.datasource.password=test-password
# テスト用の JWT 共有シークレット（JwtConfig の fail-closed 検証を満たす 32 バイト以上のダミー値。
# 本番のシークレットではないためコミットしてよい）
security.jwt.secret=test-only-jwt-secret-0123456789abcdef-not-for-production
# テスト用の API ユーザー名（ApiUserConfig を読み込むテストで使うダミー値）
security.api-user.name=test-api-user
# テスト用 API ユーザーのパスワードハッシュは、平文とハッシュの対応を固定文字列でコミットしないよう
# 各テストの @DynamicPropertySource で実行時に生成して与える（AuthControllerTest 参照）
